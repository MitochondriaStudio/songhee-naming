<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>송희 〇 남아 이름 부모 선호도 투표</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-baby text-blue-500"></i>
                    <span>송희(宋禧) 〇 남아 이름 부모 투표</span>
                </h1>
                <p class="text-xs text-slate-500 mt-1">사주 상생 발음오행(금수목/금수수/금수금) 평가 시스템</p>
            </div>
            
            <!-- Voter Toggle -->
            <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button id="voter-mom" onclick="setVoter('mom')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                    <span>👩 엄마</span>
                </button>
                <button id="voter-dad" onclick="setVoter('dad')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                    <span>👨 아빠</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Progress Banner -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm mb-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="flex items-center gap-3 p-3 bg-rose-50 rounded-xl border border-rose-100">
                <div class="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">👩</div>
                <div class="flex-1">
                    <div class="text-xs text-rose-600 font-semibold mb-1">엄마 투표 진행률</div>
                    <div class="flex justify-between items-center mb-1">
                        <span id="mom-progress-text" class="text-sm font-bold text-slate-800">0 / 124 완료</span>
                        <span id="mom-progress-percent" class="text-xs text-rose-500 font-bold">0%</span>
                    </div>
                    <div class="w-full bg-rose-200 rounded-full h-2">
                        <div id="mom-progress-bar" class="bg-rose-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 p-3 bg-blue-50 rounded-xl border border-blue-100">
                <div class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">👨</div>
                <div class="flex-1">
                    <div class="text-xs text-blue-600 font-semibold mb-1">아빠 투표 진행률</div>
                    <div class="flex justify-between items-center mb-1">
                        <span id="dad-progress-text" class="text-sm font-bold text-slate-800">0 / 124 완료</span>
                        <span id="dad-progress-percent" class="text-xs text-blue-500 font-bold">0%</span>
                    </div>
                    <div class="w-full bg-blue-200 rounded-full h-2">
                        <div id="dad-progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- How to share link -->
        <div class="mb-6 p-4 bg-indigo-50 border border-indigo-100 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-start gap-3">
                <i class="fa-solid fa-cloud-arrow-up text-indigo-500 mt-0.5 text-xl"></i>
                <div>
                    <h3 class="text-sm font-bold text-indigo-900">클라우드 데이터 공유 (서로의 투표 결과 실시간 확인)</h3>
                    <p class="text-xs text-indigo-700 mt-1">Firebase 등 별도 백엔드 없이 고유 URL 코드를 생성하여 카톡으로 전달하면 결과를 합칠 수 있습니다.</p>
                </div>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="generateShareLink()" class="flex-1 sm:flex-none px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold shadow-sm transition-all whitespace-nowrap">
                    <i class="fa-solid fa-link"></i> 공유 링크 복사
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex overflow-x-auto space-x-2 pb-2 mb-4 scrollbar-none border-b border-slate-200">
            <button onclick="setTab('wood')" id="tab-wood" class="tab-btn px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap flex items-center gap-2 transition-all">
                <span>🌿 금수목 (ㄱ, ㅋ)</span>
                <span id="count-wood" class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600 font-bold">27</span>
            </button>
            <button onclick="setTab('water')" id="tab-water" class="tab-btn px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap flex items-center gap-2 transition-all">
                <span>💧 금수수 (ㅇ, ㅎ)</span>
                <span id="count-water" class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600 font-bold">61</span>
            </button>
            <button onclick="setTab('metal')" id="tab-metal" class="tab-btn px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap flex items-center gap-2 transition-all">
                <span>⚔️ 금수금 (ㅅ, ㅈ, ㅊ)</span>
                <span id="count-metal" class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600 font-bold">36</span>
            </button>
            <button onclick="setTab('match')" id="tab-match" class="tab-btn px-4 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap flex items-center gap-2 transition-all bg-amber-50 text-amber-700 border border-amber-200">
                <span>⭐ 부모 공통 매칭</span>
                <span id="count-match" class="px-2 py-0.5 rounded-full text-xs bg-amber-500 text-white font-bold shadow-sm">0</span>
            </button>
        </div>

        <!-- Filter Sub-bar -->
        <div class="flex justify-between items-center mb-4 text-sm">
            <div id="section-info" class="text-slate-600 font-semibold bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm"></div>
            <div class="flex items-center gap-2">
                <select id="filter-vote" onchange="renderNames()" class="bg-white border border-slate-300 text-xs rounded-lg px-3 py-2 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm cursor-pointer">
                    <option value="all">전체 보기</option>
                    <option value="like">좋아요만 보기 ❤️</option>
                    <option value="unvoted">미투표 항목만 보기 ⏳</option>
                </select>
            </div>
        </div>

        <!-- Names Grid / List -->
        <div id="names-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Injection -->
        </div>

        <!-- Utility Buttons -->
        <div class="mt-10 p-5 bg-white border border-slate-200 rounded-2xl flex flex-wrap justify-between items-center gap-3 text-xs shadow-sm">
            <div class="text-slate-500"><i class="fa-solid fa-circle-info mr-1"></i> 데이터는 브라우저에 자동 저장됩니다. 기기를 변경할 땐 '공유 링크 복사'를 사용하세요.</div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="px-4 py-2 bg-slate-100 border border-slate-300 rounded-lg hover:bg-slate-200 font-bold text-slate-700 transition-colors">
                    <i class="fa-regular fa-clipboard"></i> 텍스트 요약 복사
                </button>
                <button onclick="resetData()" class="px-4 py-2 bg-rose-50 border border-rose-200 text-rose-600 rounded-lg hover:bg-rose-100 font-bold transition-colors">
                    <i class="fa-solid fa-trash-can"></i> 전체 초기화
                </button>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full text-sm font-bold shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        알림 메시지
    </div>

    <script>
        // Data structure
        const nameData = {
            wood: ['송희가', '송희간', '송희강', '송희건', '송희걸', '송희격', '송희견', '송희결', '송희겸', '송희경', '송희고', '송희공', '송희과', '송희관', '송희광', '송희교', '송희구', '송희군', '송희권', '송희귀', '송희규', '송희균', '송희극', '송희근', '송희금', '송희기', '송희길'],
            water: ['송희아', '송희안', '송희앙', '송희애', '송희약', '송희양', '송희어', '송희억', '송희여', '송희역', '송희연', '송희열', '송희염', '송희영', '송희예', '송희오', '송희옥', '송희온', '송희올', '송희완', '송희왕', '송희욕', '송희용', '송희우', '송희운', '송희원', '송희위', '송희유', '송희윤', '송희율', '송희융', '송희은', '송희의', '송희이', '송희익', '송희인', '송희일', '송희입', '송희학', '송희한', '송희할', '송희합', '송희해', '송희향', '송희헌', '송희혁', '송희현', '송희협', '송희형', '송희혜', '송희호', '송희홍', '송희화', '송희환', '송희황', '송희효', '송희훈', '송희흔', '송희흠', '송희흥', '송희희'],
            metal: ['송희사', '송희상', '송희색', '송희서', '송희석', '송희선', '송희설', '송희성', '송희소', '송희수', '송희숙', '송희순', '송희술', '송희숭', '송희습', '송희승', '송희시', '송희신', '송희실', '송희심', '송희재', '송희정', '송희주', '송희준', '송희진', '송희찬', '송희철', '송희초', '송희최', '송희축', '송희춘', '송희출', '송희충', '송희취', '송희치', '송희친']
        };

        const totalCount = 27 + 61 + 36; // 124

        // App state
        let currentVoter = localStorage.getItem('currentVoter') || 'mom';
        let currentTab = 'wood';
        let votes = { mom: {}, dad: {} };

        // Toast functionality
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }

        // URL parsing for shared state
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const dataParam = params.get('data');
            
            // Try to load from LocalStorage first
            const savedVotes = localStorage.getItem('songhee_votes');
            if (savedVotes) {
                try {
                    votes = JSON.parse(savedVotes);
                } catch(e) {}
            }

            // If URL has data, merge it
            if (dataParam) {
                try {
                    const decoded = JSON.parse(atob(dataParam));
                    // Merge logic: URL data overrides local if present
                    if (decoded.mom) votes.mom = { ...votes.mom, ...decoded.mom };
                    if (decoded.dad) votes.dad = { ...votes.dad, ...decoded.dad };
                    
                    localStorage.setItem('songhee_votes', JSON.stringify(votes));
                    showToast("🔗 링크의 투표 데이터가 성공적으로 병합되었습니다!");
                    
                    // Clean URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch(e) {
                    showToast("❌ 유효하지 않은 공유 링크입니다.");
                }
            }
        }

        // Generate Share Link
        function generateShareLink() {
            const dataStr = btoa(JSON.stringify(votes));
            const url = window.location.origin + window.location.pathname + "?data=" + dataStr;
            
            navigator.clipboard.writeText(url).then(() => {
                showToast("✅ 공유 링크가 복사되었습니다! 배우자의 카톡으로 보내주세요.");
            });
        }

        // Initialize
        function init() {
            loadFromURL();
            setVoter(currentVoter);
            setTab(currentTab);
            updateProgress();
        }

        function setVoter(voter) {
            currentVoter = voter;
            localStorage.setItem('currentVoter', voter);

            const momBtn = document.getElementById('voter-mom');
            const dadBtn = document.getElementById('voter-dad');

            if (voter === 'mom') {
                momBtn.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 bg-rose-500 text-white shadow-md transform scale-105";
                dadBtn.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 text-slate-500 hover:bg-slate-200 hover:text-slate-800";
            } else {
                dadBtn.className = "px-4 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 bg-blue-500 text-white shadow-md transform scale-105";
                momBtn.className = "px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 text-slate-500 hover:bg-slate-200 hover:text-slate-800";
            }
            renderNames();
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-md', 'scale-105');
                btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200', 'hover:bg-slate-50');
            });

            const activeBtn = document.getElementById(`tab-${tab}`);
            if (tab === 'match') {
                activeBtn.className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap flex items-center gap-2 transition-all bg-amber-500 text-white shadow-md transform scale-105";
            } else {
                activeBtn.className = "tab-btn px-4 py-2.5 rounded-xl font-bold text-sm whitespace-nowrap flex items-center gap-2 transition-all bg-slate-900 text-white shadow-md transform scale-105";
            }

            renderNames();
        }

        function vote(name, value) {
            if (!votes[currentVoter]) votes[currentVoter] = {};
            
            // Toggle vote if clicked same
            if (votes[currentVoter][name] === value) {
                delete votes[currentVoter][name];
            } else {
                votes[currentVoter][name] = value;
            }

            localStorage.setItem('songhee_votes', JSON.stringify(votes));
            updateProgress();
            renderNames();
        }

        function updateProgress() {
            const momVotes = Object.keys(votes.mom || {}).length;
            const dadVotes = Object.keys(votes.dad || {}).length;

            document.getElementById('mom-progress-text').innerText = `${momVotes} / ${totalCount} 완료`;
            document.getElementById('dad-progress-text').innerText = `${dadVotes} / ${totalCount} 완료`;

            const momPct = Math.round((momVotes / totalCount) * 100);
            const dadPct = Math.round((dadVotes / totalCount) * 100);

            document.getElementById('mom-progress-percent').innerText = `${momPct}%`;
            document.getElementById('dad-progress-percent').innerText = `${dadPct}%`;

            document.getElementById('mom-progress-bar').style.width = `${momPct}%`;
            document.getElementById('dad-progress-bar').style.width = `${dadPct}%`;

            // Calculate match count
            let matchCount = 0;
            const allNames = [...nameData.wood, ...nameData.water, ...nameData.metal];
            allNames.forEach(n => {
                if (votes.mom && votes.mom[n] === 'like' && votes.dad && votes.dad[n] === 'like') {
                    matchCount++;
                }
            });
            document.getElementById('count-match').innerText = matchCount;
        }

        function renderNames() {
            const container = document.getElementById('names-container');
            const info = document.getElementById('section-info');
            const filter = document.getElementById('filter-vote').value;

            container.innerHTML = '';

            let list = [];
            if (currentTab === 'match') {
                const allNames = [...nameData.wood, ...nameData.water, ...nameData.metal];
                list = allNames.filter(n => votes.mom && votes.mom[n] === 'like' && votes.dad && votes.dad[n] === 'like');
                info.innerHTML = `⭐ 부모 공통 <strong>'좋아요'</strong> 매칭 이름 (<span class="text-amber-600 font-bold">${list.length}</span>개)`;
            } else {
                list = nameData[currentTab] || [];
                const categoryNames = { wood: '🌿 금수목 (ㄱ, ㅋ 발음)', water: '💧 금수수 (ㅇ, ㅎ 발음)', metal: '⚔️ 금수금 (ㅅ, ㅈ, ㅊ 발음)' };
                info.innerHTML = `${categoryNames[currentTab]} 목록 (<span class="text-blue-600 font-bold">${list.length}</span>개)`;
            }

            // Apply filter
            if (filter === 'like') {
                list = list.filter(n => (votes[currentVoter] && votes[currentVoter][n] === 'like'));
            } else if (filter === 'unvoted') {
                list = list.filter(n => !(votes[currentVoter] && votes[currentVoter][n]));
            }

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-400 bg-white rounded-2xl border border-slate-200 border-dashed">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">해당하는 이름이 없습니다.</p>
                    </div>
                `;
                return;
            }

            list.forEach(name => {
                const momVote = votes.mom ? votes.mom[name] : null;
                const dadVote = votes.dad ? votes.dad[name] : null;
                const isMatch = momVote === 'like' && dadVote === 'like';

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between gap-4";

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-2xl font-bold text-slate-900 tracking-wider">${name}</span>
                            ${isMatch ? '<span class="ml-2 px-2.5 py-1 bg-gradient-to-r from-amber-400 to-amber-500 text-white text-xs font-bold rounded-full shadow-sm animate-pulse">⭐ 매칭!</span>' : ''}
                        </div>
                        <div class="flex flex-col gap-1 text-[11px] items-end">
                            <span class="px-2 py-0.5 rounded-md font-medium border ${getBadgeClass('mom', momVote)}">👩 엄마: ${getVoteLabel(momVote)}</span>
                            <span class="px-2 py-0.5 rounded-md font-medium border ${getBadgeClass('dad', dadVote)}">👨 아빠: ${getVoteLabel(dadVote)}</span>
                        </div>
                    </div>

                    <!-- Vote Controls for Current Active Voter -->
                    <div class="bg-slate-50 p-2 rounded-xl flex items-center gap-2 border border-slate-100">
                        <span class="text-[11px] font-bold px-2 py-1 rounded bg-white border border-slate-200 text-slate-500 shadow-sm">${currentVoter === 'mom' ? '👩 엄마 투표' : '👨 아빠 투표'}</span>
                        
                        <div class="flex-1 flex gap-1.5">
                            <button onclick="vote('${name}', 'like')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 ${getCurrentUserVoteClass(name, 'like', 'rose')}">
                                ❤️
                            </button>
                            <button onclick="vote('${name}', 'soso')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 ${getCurrentUserVoteClass(name, 'soso', 'amber')}">
                                🤔
                            </button>
                            <button onclick="vote('${name}', 'dislike')" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-1 ${getCurrentUserVoteClass(name, 'dislike', 'slate')}">
                                ❌
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getVoteLabel(val) {
            if (val === 'like') return '❤️ 좋음';
            if (val === 'soso') return '🤔 보통';
            if (val === 'dislike') return '❌ 별로';
            return '⏳ 대기';
        }

        function getBadgeClass(voter, val) {
            if (!val) return 'bg-slate-50 border-slate-200 text-slate-400';
            if (val === 'like') return voter === 'mom' ? 'bg-rose-50 border-rose-200 text-rose-600 font-bold' : 'bg-blue-50 border-blue-200 text-blue-600 font-bold';
            if (val === 'soso') return 'bg-amber-50 border-amber-200 text-amber-600';
            if (val === 'dislike') return 'bg-slate-100 border-slate-200 text-slate-400 line-through';
        }

        function getCurrentUserVoteClass(name, value, color) {
            const currentVote = votes[currentVoter] ? votes[currentVoter][name] : null;

            if (currentVote === value) {
                if (value === 'like') return `bg-${color}-500 text-white shadow-md ring-2 ring-${color}-200 transform scale-105`;
                if (value === 'soso') return `bg-${color}-500 text-white shadow-md ring-2 ring-${color}-200 transform scale-105`;
                if (value === 'dislike') return `bg-${color}-600 text-white shadow-md ring-2 ring-${color}-200 transform scale-105`;
            }
            return `bg-white border border-slate-200 text-slate-500 hover:bg-slate-200`;
        }

        function exportData() {
            const allNames = [...nameData.wood, ...nameData.water, ...nameData.metal];
            const matches = allNames.filter(n => votes.mom && votes.mom[n] === 'like' && votes.dad && votes.dad[n] === 'like');
            const momLikes = allNames.filter(n => votes.mom && votes.mom[n] === 'like');
            const dadLikes = allNames.filter(n => votes.dad && votes.dad[n] === 'like');

            let summary = `[송희 〇 남아 이름 부모 투표 결과]

`;
            summary += `⭐ 부모 공통 1순위 (둘 다 좋아요 - ${matches.length}개):
${matches.join(', ') || '없음'}

`;
            summary += `👩 엄마 Pick (${momLikes.length}개):
${momLikes.join(', ') || '없음'}

`;
            summary += `👨 아빠 Pick (${dadLikes.length}개):
${dadLikes.join(', ') || '없음'}
`;

            navigator.clipboard.writeText(summary).then(() => {
                showToast("📋 텍스트 결과가 복사되었습니다!");
            });
        }

        function resetData() {
            if (confirm("정말로 모든 투표 데이터를 초기화하시겠습니까? 복구할 수 없습니다.")) {
                localStorage.removeItem('songhee_votes');
                votes = { mom: {}, dad: {} };
                // Clean URL if present
                window.history.replaceState({}, document.title, window.location.pathname);
                updateProgress();
                renderNames();
                showToast("🗑️ 초기화 되었습니다.");
            }
        }

        // Start app
        init();
    </script>
</body>
</html>
